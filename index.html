<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AShell</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: transparent;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.72);
        background: rgba(15, 17, 21, var(--ashell-boot-alpha, 1));
        font: 600 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.08em;
      }
      @media (prefers-color-scheme: light) {
        #boot-splash {
          color: rgba(20, 24, 33, 0.72);
          background: rgba(244, 246, 251, var(--ashell-boot-alpha, 1));
        }
      }
    </style>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("ashell:window-opacity");
          var n = raw ? Number(raw) : 1;
          if (!isFinite(n)) n = 1;
          n = Math.min(1, Math.max(0.3, n));
          document.documentElement.style.setProperty("--ashell-boot-alpha", String(n));
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </head>

  <body>
    <div id="boot-splash">ASHELL</div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
