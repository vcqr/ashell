name: "publish"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu"
          # Linux ARM64 (glibc, native ARM runner — public repos)
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            args: "--target aarch64-unknown-linux-gnu"
          # macOS ARM64
          - platform: macos-15
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # macOS x86_64
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # Windows x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          # Windows ARM64
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            args: "--target aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm install

      - name: install sidecar dependencies
        run: cd sidecar-ai && npm install

      - name: generate release notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            # 首次发布：全部 commit
            NOTES=$(git log --no-merges --pretty=format:"- %s" HEAD)
          else
            NOTES=$(git log --no-merges --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          # 转义换行，写入 GITHUB_OUTPUT
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body || 'See assets to download and install.' }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Windows 便携版（免安装压缩包）：主程序 + AI sidecar + ConPTY 三件套，
      # 与 NSIS 安装包同一批构建产物；WebView2 运行时依赖系统自带的 Evergreen
      # （Win11 内置，Win10 缺失时需手动装），安装包会自动补装而便携包不会。
      # Linux 便携等价物是 AppImage（当前未启用），macOS 用 .app/DMG 即可。
      - name: build portable archive (windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "src-tauri/target/${{ matrix.target }}/release"
          if (-not (Test-Path "$dir/ashell.exe")) { throw "ashell.exe not found in $dir" }
          $arch = if ("${{ matrix.target }}".StartsWith("x86_64")) { "x64" } else { "arm64" }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $zip = "AShell_${version}_windows_${arch}_portable.zip"
          $stage = "portable-staging/AShell"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$dir\ashell.exe", "$dir\app-ai.exe", "$dir\OpenConsole.exe", "$dir\conpty.dll" -Destination $stage
          Compress-Archive -Path "portable-staging\AShell" -DestinationPath $zip -Force
          "PORTABLE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: upload portable archive (artifact)
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.target }}
          path: AShell_*_portable.zip
          if-no-files-found: error

      - name: upload portable archive to release
        if: startsWith(matrix.platform, 'windows') && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" "$env:PORTABLE_ZIP" --clobber
