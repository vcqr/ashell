# AShell Web Server
#
#   ./scripts/build-server-image.sh   # 交叉编译 + 组装镜像（详见脚本注释）
#   docker compose up -d
#
# 浏览器访问 http://<宿主机IP>:8090 ，令牌见容器日志或数据目录下的 web-token
#
# 数据目录：默认使用命名卷 ashell-data（全新数据，独立于本机 ~/.ashell）。
# - 令牌与加密密钥（secret.key）都在卷里，docker compose restart 保留；
#   docker compose down -v 会连卷一起删掉（加密数据不可恢复，慎用）。
# - 要与本机桌面版共用数据，改挂宿主目录（勿同时运行桌面版）：
#     volumes:
#       - ~/.ashell:/data/.ashell

services:
  ashell-server:
    build: ./docker
    image: ashell-server:latest
    container_name: ashell-server
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      # 容器无 OS 钥匙串/DBus，强制使用文件密钥（镜像内已内置，此处显式声明）
      ASHELL_FORCE_KEY_FILE: "1"
      # 可选：固定登录令牌（缺省自动生成并持久化到数据卷的 web-token）
      # ASHELL_WEB_TOKEN: "change-me"
      # 可选：日志级别（默认 info）
      # RUST_LOG: debug
    volumes:
      - ashell-data:/data/.ashell
      # 前端只读挂载：改前端后跑 scripts/sync-frontend.sh，刷新浏览器即生效，
      # 无需重建镜像（镜像内仍 COPY 一份 dist，供全新部署开箱即用）
      - ./docker/dist:/app/dist:ro
    # Linux 服务器上若卷属主非 uid 1000，放开下面一行并替换为实际 uid/gid：
    # user: "1000:1000"

volumes:
  ashell-data:
