[package]
name = "ashell"
version = "0.1.25"
description = "A modern cross-platform terminal / SSH client built with Tauri 2 + Vue 3"
authors = ["vcqr"]
license = "MIT"
repository = "https://github.com/vcqr/ashell"
homepage = "https://github.com/vcqr/ashell"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ashell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 双目标构建：
#   cargo build --bin ashell                              # 桌面版（Tauri 壳，default features）
#   cargo build --bin ashell-server --no-default-features # Web 服务器版（复用同一套核心业务层）
[[bin]]
name = "ashell"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "ashell-server"
path = "src/bin/ashell-server.rs"

[features]
default = ["desktop"]
# Tauri 壳及其插件仅在桌面目标启用；Web server 只依赖纯 Rust 业务层
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-global-shortcut",
    "dep:windows",
    "dep:webview2-com",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 桌面壳（web server 不启用；tauri-plugin-opener 供 local_fs 在两形态下打开/显示文件，保持必选）
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "image-png", "tray-icon"], optional = true }
tauri-plugin-opener = "2"
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP / WebSocket server
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.12", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["full"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
futures = "0.3"
futures-util = "0.3"

# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "chrono",
] }

# Logging
log = "0.4"
env_logger = "0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "std", "smallvec"] }

# SSH / SFTP
russh = "0"
russh-sftp = "3"
russh-keys = "0"

# Utilities
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
once_cell = "1"
bytes = "1"

# Move to system trash (macOS Finder / Windows Recycle Bin / Linux XDG trash)
trash = "5"

# Crypto - AES-GCM for credential encryption
aes-gcm = "0.11"
rand = "0.10"
base64 = "0.23"
hex = "0.4"
subtle = "2"

# OS keychain (Windows Credential Manager / macOS Keychain / Linux Secret Service)
keyring = { version = "4", features = ["v1"] }

# System font enumeration
font-kit = "0.14"

# HTTP client (fetch model list from provider APIs)
# 0.13 起 query() 方法独立成 query feature，需显式开启
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls"] }

# S3-compatible object storage (backup/restore)
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }

# Password-based key derivation for encrypted backups
pbkdf2 = "0"
sha2 = "0"

# Local PTY (Windows ConPTY / Unix forkpty)
portable-pty = "0.9"

# Serial port
serialport = { version = "4", default-features = false }

libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0", features = ["Win32_System_Threading", "Win32_Foundation"] }
# 关闭 WebView2 浏览器快捷键（F5 刷新等）：既防误触重载，也让 F 键能录制成全局热键。
# 版本必须与 tauri 内置 wry 的 webview2-com 完全一致，保证 COM 接口类型同源，否则 cast() 编译不过——
# 这两项不能单独升级：tauri 2.11.5 → wry 0.55 → webview2-com 0.38 / windows 0.61。
# wry 0.57 起才用 webview2-com 0.39 / windows 0.62，等 tauri 发版跟进后再同步改这里。
# 仅桌面目标使用（lib.rs disable_browser_accelerators），随 desktop feature 开关
windows = { version = "0.61", optional = true }
webview2-com = { version = "0.38", optional = true }

[dev-dependencies]
tempfile = "3"
