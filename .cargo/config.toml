# cargo 配置按 CWD 向上查找：tauri-action 从仓库根调用 cargo，src-tauri 内调用
# 也会向上命中本文件，故必须放仓库根而非 src-tauri 下。

[env]
# winpty-rs conpty_local 拉取的 NuGet 包版本：与 src-tauri/resources/conpty
# 同源（Microsoft.Windows.Console.ConPTY 1.24.260710001），保证链接用的
# conpty.lib 与随包分发的 conpty.dll 导出一致，两边升级必须同步。
WINPTY_RS_CONPTY_VERSION = "1.24.260710001"

[target.x86_64-pc-windows-msvc]
# 两个静态导入的延迟加载：
# - conpty.dll：winpty-rs 的 ConPTY 后端（build.rs 自动启用 + conpty_local）静态
#   导入它，但本应用从不调用该后端（老系统走 winpty、新系统走 portable-pty）。
#   延迟加载规避 Wine 等环境下 conpty.dll 加载失败导致整个 app 无法启动。
# - winpty.dll：老系统回退后端的运行库。正常分发下它与 exe 同目录，但即使
#   分发缺文件，延迟加载也能保证 app 本体在 Win10 1809+/Win11 上照常启动
#   （仅在真正走到 winpty 后端时才会解析），不再出现
#   "The code execution cannot proceed because winpty.dll was not found"。
rustflags = ["-C", "link-args=/DELAYLOAD:conpty.dll /DELAYLOAD:winpty.dll delayimp.lib"]
